"""
gunicorn.conf.py — Production Gunicorn configuration for GreenProof
Pass to gunicorn with: gunicorn -c gunicorn.conf.py run:app
(The Dockerfile CMD already uses these flags inline; use this file
 if you want more control or run gunicorn outside Docker.)
"""
import multiprocessing

# ── Binding ───────────────────────────────────────────────────────
bind    = "0.0.0.0:5000"
backlog = 2048

# ── Workers ───────────────────────────────────────────────────────
# Rule of thumb: 2-4 × CPU count for sync workers
workers     = multiprocessing.cpu_count() * 2 + 1
worker_class = "sync"      # switch to "gevent" if you add async I/O
threads     = 2
timeout     = 120
keepalive   = 5

# ── Logging ───────────────────────────────────────────────────────
accesslog   = "-"           # stdout → picked up by Docker / systemd
errorlog    = "-"
loglevel    = "info"
access_log_format = '%(h)s "%(r)s" %(s)s %(b)s %(D)sµs'

# ── Process naming ────────────────────────────────────────────────
proc_name   = "greenproof"

# ── Security ──────────────────────────────────────────────────────
limit_request_line   = 4096
limit_request_fields = 100